<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0c2426;
  --panel:#123032;
  --panel-alt:#173a3c;
  --line:#2c4b4d;
  --text:#f2f2ee;
  --text-dim:#9db3b3;
  --accent:#f2c230;
  --accent-dim:#7a6420;
  --complete:#6fbf8f;
  --progress:#5aa9c2;
  --hold:#d97a5a;
  --ready:#8fa3a3;
  --danger:#e0524f;
  --warning:#e8853d;
}
*{box-sizing:border-box;}
.ci-root{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100%;
  padding:28px 20px 60px;
  border-radius:14px;
}
.ci-mono{font-family:'IBM Plex Mono',monospace;}
.ci-display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;}
.ci-wrap{max-width:640px;margin:0 auto;}

/* Slate header */
.ci-slate{
  background:repeating-linear-gradient(-45deg, var(--panel-alt) 0 14px, #0e2a2c 14px 28px);
  border:1px solid var(--line);
  border-radius:10px 10px 0 0;
  padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);
}
.ci-slate span.hi{color:var(--accent);}

/* Filmstrip nav */
.ci-strip{display:flex;gap:4px;padding:14px 0 18px;overflow-x:auto;}
.ci-frame{
  flex:0 0 auto;width:26px;height:20px;border-radius:2px;
  border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--text-dim);background:var(--panel);
}
.ci-frame.done{border-color:var(--accent-dim);background:var(--accent-dim);color:var(--text);}
.ci-frame.current{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent);}

.ci-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 10px 10px;
  padding:22px;
}
.ci-artist-name{font-size:32px;font-weight:400;margin:0 0 4px;color:var(--accent);}
.ci-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}

.ci-task-row{
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px;
  margin-bottom:14px;
  position:relative;
}
.ci-task-row .ci-remove{
  position:absolute;top:10px;right:10px;
  background:none;border:none;color:var(--text-dim);
  cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;
  border-radius:4px;
}
.ci-task-row .ci-remove:hover{color:var(--hold);background:rgba(255,255,255,.05);}

.ci-field{margin-bottom:12px;}
.ci-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;}
.ci-select, .ci-input, .ci-textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:9px 10px;border-radius:6px;font-family:'Inter',sans-serif;font-size:14px;
}
.ci-textarea{resize:vertical;min-height:56px;}
.ci-due-display{font-size:13px;color:var(--accent);font-family:'IBM Plex Mono',monospace;}

.ci-pillrow{display:flex;flex-wrap:wrap;gap:6px;}
.ci-pill{position:relative;}
.ci-pill input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0;top:0;left:0;}
.ci-pill span{
  display:inline-block;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
  font-size:12.5px;color:var(--text-dim);cursor:pointer;user-select:none;
}
.ci-pill input:checked + span{color:var(--bg);border-color:transparent;}
.ci-pill.status-Complete input:checked + span{background:var(--complete);}
.ci-pill.status-In-Progress input:checked + span{background:var(--progress);}
.ci-pill.status-On-Hold input:checked + span{background:var(--hold);}
.ci-pill.status-Ready-to-Begin input:checked + span{background:var(--ready);}
.ci-pill.pace-On-Track input:checked + span{background:var(--complete);}
.ci-pill.pace-At-Risk input:checked + span{background:var(--accent);}
.ci-pill.pace-Behind input:checked + span{background:var(--hold);}
.ci-pill.pace-N-A input:checked + span{background:var(--ready);}
.ci-pill.blocker-Yes input:checked + span{background:var(--hold);}
.ci-pill.blocker-No input:checked + span{background:var(--ready);}

.ci-addtask{
  background:none;border:1px dashed var(--line);color:var(--text-dim);
  width:100%;padding:10px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:18px;
}
.ci-addtask:hover{border-color:var(--accent);color:var(--accent);}

.ci-navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:center;}
.ci-navrow-links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.ci-btn{
  font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
  padding:11px 18px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--text);cursor:pointer;
}
.ci-btn:disabled{opacity:.35;cursor:not-allowed;}
.ci-btn.primary{background:var(--accent);border-color:var(--accent);color:#0c2426;}
.ci-btn.ghost{border-color:transparent;color:var(--text-dim);}
.ci-btn.ghost:hover{color:var(--text);}

/* Import view */
.ci-hero{padding:6px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.ci-hero h1{font-size:30px;margin:0 0 8px;line-height:1.05;}
.ci-hero p{color:var(--text-dim);font-size:14px;line-height:1.5;max-width:520px;padding-bottom:14px;}
.ci-textarea-big{width:100%;min-height:180px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:14px;}
.ci-format-hint{font-size:12px;color:var(--text-dim);margin:8px 0 18px;line-height:1.6;}
.ci-format-hint code{background:var(--panel-alt);padding:1px 5px;border-radius:4px;}
.ci-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ci-note{font-size:12.5px;color:var(--accent);margin-bottom:14px;}
.ci-dropzone{
  border:1.5px dashed var(--line);border-radius:10px;padding:34px 20px;text-align:center;
  cursor:pointer;margin-bottom:10px;background:var(--panel);transition:border-color .15s,background .15s;
}
.ci-dropzone:hover, .ci-dropzone.drag{border-color:var(--accent);background:var(--panel-alt);}
.ci-drop-icon{font-size:22px;color:var(--text-dim);margin-bottom:8px;}
.ci-drop-text{font-size:14.5px;color:var(--text);}
.ci-drop-link{color:var(--accent);text-decoration:underline;}
.ci-drop-sub{font-size:12px;color:var(--text-dim);margin-top:6px;}

/* Summary / history */
.ci-sum-artist{border-bottom:1px solid var(--line);padding:14px 0;}
.ci-sum-artist:last-child{border-bottom:none;}
.ci-sum-name{font-weight:600;font-size:15px;margin-bottom:6px;}
.ci-sum-task{font-size:13px;color:var(--text-dim);margin:3px 0;padding-left:10px;border-left:2px solid var(--line);}
.ci-submission-block{margin-bottom:10px;}
.ci-submission-block:not(:first-child){border-top:1px dashed var(--line);padding-top:10px;margin-top:8px;}
.ci-submission-time{font-size:10.5px;color:var(--accent);font-family:'IBM Plex Mono',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.ci-badge{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:10px;margin-left:6px;color:#0c2426;}
.ci-label-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ci-label-row .ci-label{margin-bottom:0;}
.ci-urgency-badge{margin-left:0;color:#fff;font-weight:600;font-size:10.5px;padding:3px 9px;}
.ci-histlist{list-style:none;padding:0;margin:0;}
.ci-histlist li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.ci-csv-row{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.ci-csv-row:last-child{border-bottom:none;}
.ci-csv-row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ci-histlist li:hover{color:var(--accent);}
.ci-empty{color:var(--text-dim);font-size:13px;padding:20px 0;}
.ci-toplink{background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0;}
.ci-export-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ci-export-feedback{font-size:12.5px;}
.ci-blocker-bar{display:flex;justify-content:space-between;align-items:center;margin:-10px 0 12px;flex-wrap:wrap;gap:8px;}
.ci-blocker-bar-left{display:flex;gap:16px;}
.ci-blocker-bar .ci-toplink{color:var(--hold);}
.ci-blocker-bar-left .ci-toplink{color:var(--text-dim);}
.ci-show-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
@media (max-width:480px){.ci-show-grid{grid-template-columns:1fr;}}
.ci-show-card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px 16px;text-align:left;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s;
}
.ci-show-card:hover{border-color:var(--accent);background:var(--panel-alt);}
.ci-show-code{font-family:'Anton',sans-serif;font-size:26px;font-weight:400;letter-spacing:.02em;color:var(--accent);}
.ci-show-meta{font-size:12px;color:var(--text-dim);}
.ci-show-done{font-size:11px;color:var(--accent);}
.ci-artist-list li{cursor:pointer;}
.ci-artist-row-name{font-weight:600;font-size:14.5px;}
.ci-artist-row-meta{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
.ci-artist-row-done{color:var(--complete);}
.ci-date-field{position:relative;display:inline-block;}
.ci-date-display{
  background:var(--bg);border:1px solid var(--line);color:var(--text);
  padding:9px 14px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:14px;
  cursor:pointer;min-width:200px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.ci-date-display:hover{border-color:var(--accent);}
.ci-cal-icon{opacity:.7;}
.ci-cal-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.ci-cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:13.5px;}
.ci-cal-nav{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:2px 8px;border-radius:4px;}
.ci-cal-nav:hover{color:var(--accent);background:var(--panel-alt);}
.ci-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.ci-cal-dow{font-size:10px;color:var(--text-dim);text-align:center;padding:4px 0;}
.ci-cal-day{font-size:12.5px;text-align:center;padding:7px 0;border-radius:6px;cursor:pointer;color:var(--text);}
.ci-cal-day:hover{background:var(--panel-alt);}
.ci-cal-day.today{border:1px solid var(--accent-dim);}
.ci-cal-day.selected{background:var(--accent);color:var(--bg);font-weight:600;}
.ci-cal-day.empty{visibility:hidden;pointer-events:none;}
.ci-artist-row.current{background:var(--panel-alt);}
.ci-artist-row-tag{font-size:10px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:8px;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em;}
.ci-landing-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;}
.ci-landing-card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px 18px;text-align:left;cursor:pointer;color:var(--text);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s;
}
.ci-landing-card:hover{border-color:var(--accent);background:var(--panel-alt);}
.ci-landing-title{font-family:'Anton',sans-serif;font-size:20px;font-weight:400;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);}
.ci-landing-sub{font-size:13px;color:var(--text-dim);}
.ci-footer{
  max-width:640px;margin:32px auto 0;padding-top:14px;border-top:1px solid var(--line);
  font-size:11px;letter-spacing:.08em;color:var(--text-dim);text-transform:uppercase;
}
.ci-home-bar{max-width:640px;margin:0 auto 10px;}
.ci-home-link{background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;padding:4px 0;}
.ci-home-link:hover{color:var(--accent);}
</style>

<div class="ci-root">
  <div class="ci-home-bar"><button class="ci-home-link" id="ci-home-btn">&larr; Home</button></div>
  <div class="ci-wrap" id="ci-app"></div>
  <div class="ci-footer">BIG SHOT PICTURES</div>
</div>

<script>
(function(){
  const STATUS_OPTS = ['Ready to Begin','In Progress','On Hold','Complete'];
  const PACE_OPTS = ['On Track','At Risk','Behind','N/A'];
  const BLOCKER_OPTS = ['Yes','No'];
  const STATUS_COLOR = {'Ready to Begin':'var(--ready)','In Progress':'var(--progress)','On Hold':'var(--hold)','Complete':'var(--complete)'};
  const PACE_COLOR = {'On Track':'var(--complete)','At Risk':'var(--accent)','Behind':'var(--hold)','N/A':'var(--ready)'};

  const today = new Date();
  const todayKey = today.toISOString().slice(0,10); // the real, actual "today" — used as picker defaults
  function labelForDate(dateStr){
    const parts = String(dateStr||'').split('-').map(n=>parseInt(n,10));
    const dt = (parts.length===3 && !parts.some(isNaN)) ? new Date(parts[0], parts[1]-1, parts[2]) : new Date();
    return dt.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'});
  }

  let state = {
    view:'landing',
    role:null,            // 'production' | 'artist'
    activeDate:todayKey,  // the date whose roster/check-in we're working with
    prodDateMode:null,    // 'import' | 'checkin' — what the production date-picker screen is for
    flashMessage:null,
    importResult:null,
    calPickerOpen:false,
    confirmDeleteDate:null,
    calPickerYear:null,
    calPickerMonth:null,
    artistOrder:[],
    artistTasks:{},      // artist -> [{task, due}]  (FILTERED to the selected show, or to one self-serve artist)
    rawArtistOrder:[],
    rawArtistTasks:{},   // artist -> [{task, due, show}]  (FULL import, all shows)
    selectedShow:null,   // e.g. 'ELS', or 'ALL'
    selectedSelfArtist:null,
    checkin:{},          // artist -> {entries:[{taskChoice,otherText,due,status,pace,notes}]}
    currentIndex:0,
    reportDate:null,
    reportShowFilter:'ALL',
    artistPickerReturn:null
  };

  const app = document.getElementById('ci-app');

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slug(s){ return String(s).replace(/[^a-zA-Z0-9]+/g,'-'); }

  // ===================================================================
  // BACKEND CONFIG — paste your deployed Google Apps Script "Web app URL"
  // between the quotes below (it ends in /exec). Nothing will save until
  // this is filled in.
  // ===================================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbwdAD0BtGhyRDXcpZH_obYKoldlQ0tYKmT-_jIQ8WsUqrL8aWk-ShLAqnx3myfLK9nSmA/exec";

  let lastStorageError = null;
  const NO_API_MSG = "This tool isn't connected to its data backend yet — the Google Apps Script URL hasn't been set. See the comment near the top of the file.";

  async function storageGet(key, shared){
    if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){ lastStorageError = NO_API_MSG; return null; }
    try{
      const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
      const data = await res.json();
      return (data && data.value) ? data.value : null;
    }catch(e){
      lastStorageError = (e && e.message) ? e.message : String(e);
      return null;
    }
  }
  async function storageSet(key, value, shared){
    lastStorageError = null;
    if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){ lastStorageError = NO_API_MSG; return; }
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({action:'set', key, value})
      });
      const data = await res.json();
      if(!data || !data.ok){ lastStorageError = 'Backend did not confirm the save.'; }
    }catch(e){
      lastStorageError = (e && e.message) ? e.message : String(e);
      console.error('save failed', e);
    }
  }
  async function storageList(prefix, shared){
    if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){ lastStorageError = NO_API_MSG; return []; }
    try{
      const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
      const data = await res.json();
      return (data && data.keys) ? data.keys : [];
    }catch(e){
      lastStorageError = (e && e.message) ? e.message : String(e);
      return [];
    }
  }
  async function storageDelete(key, shared){
    if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){ lastStorageError = NO_API_MSG; return false; }
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({action:'delete', key})
      });
      const data = await res.json();
      return !!(data && data.ok);
    }catch(e){
      lastStorageError = (e && e.message) ? e.message : String(e);
      return false;
    }
  }

  const DATES_KEY = 'entry-dates';

  function slugKey(s){
    return String(s).trim().replace(/[\s\/\\'"]+/g, '_').slice(0,150) || 'unknown';
  }
  function entryKey(dateKey, artist, submissionId){ return `entry:${dateKey}:${slugKey(artist)}:${submissionId}`; }
  function rosterKey(dateKey){ return `roster:${dateKey}`; }

  async function pushRosterToShared(dateKey, meta){
    const payload = {
      order: state.rawArtistOrder,
      tasks: state.rawArtistTasks,
      uploadedAt: new Date().toISOString(),
      fileName: (meta && meta.fileName) || null
    };
    await storageSet(rosterKey(dateKey), JSON.stringify(payload), true);
  }
  async function loadRosterFromShared(dateKey){
    const raw = await storageGet(rosterKey(dateKey), true);
    if(!raw) return null;
    try{ return JSON.parse(raw); }catch(e){ return null; }
  }
  // Discovers every date that has an uploaded roster by scanning storage directly —
  // this naturally includes CSVs uploaded before this management screen existed,
  // rather than relying on a separate registry that would miss older uploads.
  async function listAllRosterDates(){
    const keys = await storageList('roster:', true);
    return keys.map(k => k.replace('roster:', '')).sort().reverse();
  }
  function summarizeRoster(roster){
    if(!roster || !roster.order) return {artistCount:0, taskCount:0};
    let taskCount = 0;
    roster.order.forEach(a => { taskCount += (roster.tasks[a]||[]).length; });
    return {artistCount: roster.order.length, taskCount};
  }
  async function deleteRosterForDate(dateKey){
    return await storageDelete(rosterKey(dateKey), true);
  }

  async function recordEntryDate(dateKey){
    let dates = [];
    try{ const raw = await storageGet(DATES_KEY, true); dates = raw ? JSON.parse(raw) : []; }catch(e){ dates = []; }
    if(!dates.includes(dateKey)){
      dates.push(dateKey);
      dates.sort().reverse();
      await storageSet(DATES_KEY, JSON.stringify(dates), true);
    }
  }
  async function listAllEntryDates(){
    try{ const raw = await storageGet(DATES_KEY, true); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
  }

  // Every submission creates its OWN record — never overwrites a previous one.
  // This keeps a full timestamped history per artist per day, rather than a
  // single "current status" that later check-ins would silently replace.
  async function saveArtistEntry(dateKey, artist, entries){
    const submissionId = `${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    const payload = {artist, date: dateKey, entries, submittedAt: new Date().toISOString(), submissionId};
    await storageSet(entryKey(dateKey, artist, submissionId), JSON.stringify(payload), true);
    await recordEntryDate(dateKey);
    return payload;
  }

  // Fetches every submission for one artist on one date (not just the latest).
  async function listArtistEntries(dateKey, artist){
    const keys = await storageList(`entry:${dateKey}:${slugKey(artist)}:`, true);
    const results = await Promise.all(keys.map(async k=>{
      const raw = await storageGet(k, true);
      if(!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    }));
    return results.filter(Boolean).sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
  }
  // Just the most recent submission for one artist on one date (used for
  // lightweight "already submitted today" checks — not for pre-filling forms).
  async function getLatestArtistEntry(dateKey, artist){
    const all = await listArtistEntries(dateKey, artist);
    return all.length ? all[0] : null;
  }
  // Every individual submission for a date, across every artist — this is the
  // full history for that day, used by the Report.
  async function listEntriesForDate(dateKey){
    const keys = await storageList(`entry:${dateKey}:`, true);
    const results = await Promise.all(keys.map(async k=>{
      const raw = await storageGet(k, true);
      if(!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    }));
    return results.filter(Boolean);
  }


  // Full CSV/TSV parser: respects quoted fields that span multiple physical lines
  // (e.g. multi-line notes fields), unlike a naive split-by-newline approach.
  function parseDelimited(text, delim){
    const rows = [];
    let row = [];
    let cur = '';
    let inQuotes = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          if(text[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === delim){ row.push(cur); cur=''; }
        else if(ch === '\r'){ /* skip, \n handles the break */ }
        else if(ch === '\n'){ row.push(cur); cur=''; rows.push(row); row=[]; }
        else cur += ch;
      }
    }
    if(cur.length || row.length){ row.push(cur); rows.push(row); }
    return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c.length));
  }

  function parseImport(text){
    // strip BOM (common in Excel/Airtable CSV exports)
    text = text.replace(/^\uFEFF+/, '');
    if(!text.trim()) return {order:[], tasks:{}};
    const firstLine = text.split(/\r\n|\n/, 1)[0];
    const delim = firstLine.indexOf('\t') >= 0 ? '\t' : ',';
    let rows = parseDelimited(text, delim);
    if(!rows.length) return {order:[], tasks:{}};
    let headerIdx = {artist:0, task:1, start:2, due:3};
    let start = 0;
    const first = rows[0].map(c=>c.toLowerCase().trim());
    const looksLikeHeader = first.some(c=>c.includes('artist') || c.includes('name') || c.includes('item') || c.includes('task'));
    if(looksLikeHeader){
      const assigned = {};
      // pass 1: exact/near-exact header matches (avoids "Necessary For (Production Task)" stealing the task column)
      first.forEach((c,i)=>{
        if(!assigned.artist && (c==='artist'||c==='assignee'||c==='name')) { headerIdx.artist=i; assigned.artist=true; }
        if(!assigned.task && (c==='item'||c==='task'||c==='items')) { headerIdx.task=i; assigned.task=true; }
        if(!assigned.start && (c==='start'||c==='start date'||c==='projected start')) { headerIdx.start=i; assigned.start=true; }
        if(!assigned.due && (c==='due'||c==='due date'||c==='deadline'||c==='end'||c==='end date'||c==='projected end')) { headerIdx.due=i; assigned.due=true; }
      });
      // pass 2: loose substring fallback for any field still unmatched, skipping relational columns
      first.forEach((c,i)=>{
        const isRelational = c.includes('necessary') || c.includes('dependent');
        if(!assigned.artist && (c.includes('artist')||c.includes('assignee'))) { headerIdx.artist=i; assigned.artist=true; }
        if(!assigned.task && !isRelational && (c.includes('item')||c.includes('task'))) { headerIdx.task=i; assigned.task=true; }
        if(!assigned.start && c.includes('start')) { headerIdx.start=i; assigned.start=true; }
        if(!assigned.due && !isRelational && (c.includes('due')||c.includes('deadline')||c.includes('end'))) { headerIdx.due=i; assigned.due=true; }
      });
      start = 1;
    }
    const order = [];
    const tasks = {};
    for(let i=start;i<rows.length;i++){
      const r = rows[i];
      const artist = r[headerIdx.artist];
      if(!artist) continue;
      const task = r[headerIdx.task] || '(untitled task)';
      const due = r[headerIdx.due] || '';
      const taskStart = r[headerIdx.start] || '';
      const show = task.slice(0,3).toUpperCase() || 'UNK';
      if(!tasks[artist]){ tasks[artist]=[]; order.push(artist); }
      tasks[artist].push({task, due, start: taskStart, show});
    }
    return {order, tasks};
  }

  // Summarizes the shows found in the raw import: code, how many artists, how many tasks
  function getShowSummary(){
    const map = {};
    state.rawArtistOrder.forEach(artist=>{
      (state.rawArtistTasks[artist]||[]).forEach(t=>{
        if(!map[t.show]) map[t.show] = {artists:new Set(), taskCount:0};
        map[t.show].artists.add(artist);
        map[t.show].taskCount++;
      });
    });
    return Object.keys(map).sort().map(code=>({
      code, artistCount: map[code].artists.size, taskCount: map[code].taskCount
    }));
  }

  // Filters the raw (all-shows) import down to just one show code, or 'ALL' for everyone
  function applyShowFilter(code){
    state.selectedShow = code;
    if(code === 'ALL'){
      state.artistOrder = state.rawArtistOrder.slice();
      state.artistTasks = {};
      state.rawArtistOrder.forEach(a=>{
        state.artistTasks[a] = state.rawArtistTasks[a].map(t=>({task:t.task, due:t.due, start:t.start}));
      });
    } else {
      state.artistOrder = state.rawArtistOrder.filter(a => state.rawArtistTasks[a].some(t=>t.show===code));
      state.artistTasks = {};
      state.artistOrder.forEach(a=>{
        state.artistTasks[a] = state.rawArtistTasks[a].filter(t=>t.show===code).map(t=>({task:t.task, due:t.due, start:t.start}));
      });
    }
  }

  async function goToCheckinForShow(code){

  // ---------- CUSTOM CALENDAR WIDGET (works identically in every browser) ----------
  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymdStr(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; } // m is 0-indexed
  function parseYmd(str){
    const parts = String(str||'').split('-').map(n=>parseInt(n,10));
    if(parts.length===3 && !parts.some(isNaN)) return {y:parts[0], m:parts[1]-1, d:parts[2]};
    const t = new Date();
    return {y:t.getFullYear(), m:t.getMonth(), d:t.getDate()};
  }
  function shortDateLabel(dateStr){
    const p = parseYmd(dateStr);
    const dt = new Date(p.y, p.m, p.d);
    return dt.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  }
  function formatTimeOfDay(isoStr){
    try{ return new Date(isoStr).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); }
    catch(e){ return ''; }
  }
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  function buildCalendarDropdownHTML(viewYear, viewMonth, selectedStr){
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startDow = firstOfMonth.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const todayP = parseYmd(todayKey);
    const selP = parseYmd(selectedStr);

    let cells = '';
    for(let i=0;i<startDow;i++){ cells += `<div class="ci-cal-day empty"></div>`; }
    for(let d=1; d<=daysInMonth; d++){
      const isToday = (todayP.y===viewYear && todayP.m===viewMonth && todayP.d===d);
      const isSelected = (selP.y===viewYear && selP.m===viewMonth && selP.d===d);
      cells += `<div class="ci-cal-day${isToday?' today':''}${isSelected?' selected':''}" data-date="${ymdStr(viewYear,viewMonth,d)}">${d}</div>`;
    }

    return `
      <div class="ci-cal-dropdown" id="cal-dropdown">
        <div class="ci-cal-header">
          <button type="button" class="ci-cal-nav" data-nav="-1">&larr;</button>
          <span>${MONTH_NAMES[viewMonth]} ${viewYear}</span>
          <button type="button" class="ci-cal-nav" data-nav="1">&rarr;</button>
        </div>
        <div class="ci-cal-grid">
          ${DOW_NAMES.map(d=>`<div class="ci-cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
    `;
  }

  // Renders a clickable date field + (optionally open) calendar dropdown.
  // selectedStr: the currently chosen date (YYYY-MM-DD). onSelect(dateStr): called when a day is clicked.
  function renderDateFieldHTML(selectedStr){
    if(state.calPickerOpen && (state.calPickerYear==null || state.calPickerMonth==null)){
      const p = parseYmd(selectedStr);
      state.calPickerYear = p.y;
      state.calPickerMonth = p.m;
    }
    return `
      <div class="ci-date-field">
        <button type="button" class="ci-date-display" id="cal-display">
          <span>${esc(shortDateLabel(selectedStr))}</span>
          <span class="ci-cal-icon">&#128197;</span>
        </button>
        ${state.calPickerOpen ? buildCalendarDropdownHTML(state.calPickerYear, state.calPickerMonth, selectedStr) : ''}
      </div>
    `;
  }

  function wireDateField(onSelect){
    const display = document.getElementById('cal-display');
    if(display){
      display.onclick = () => {
        state.calPickerOpen = !state.calPickerOpen;
        if(!state.calPickerOpen){ state.calPickerYear = null; state.calPickerMonth = null; }
        render();
      };
    }
    const dropdown = document.getElementById('cal-dropdown');
    if(dropdown){
      dropdown.querySelectorAll('[data-nav]').forEach(btn=>{
        btn.onclick = (ev) => {
          ev.stopPropagation();
          state.calPickerMonth += parseInt(btn.dataset.nav,10);
          if(state.calPickerMonth < 0){ state.calPickerMonth = 11; state.calPickerYear--; }
          if(state.calPickerMonth > 11){ state.calPickerMonth = 0; state.calPickerYear++; }
          render();
        };
      });
      dropdown.querySelectorAll('[data-date]').forEach(cell=>{
        cell.onclick = (ev) => {
          ev.stopPropagation();
          state.calPickerOpen = false;
          state.calPickerYear = null;
          state.calPickerMonth = null;
          onSelect(cell.dataset.date);
        };
      });
    }
  }

  function countBlockers(){
    let n=0;
    Object.values(state.checkin).forEach(c=>{
      (c.entries||[]).forEach(e=>{ if(e.status==='On Hold' || e.pace==='Behind') n++; });

  }

  function renderImport(){

    let loadedText = '';
    let loadedFileName = null;
    const startBtn = document.getElementById('btn-start');
    const fileInfo = document.getElementById('loaded-file-info');
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    function setLoadedText(text, sourceLabel, fileName){
      loadedText = text;

    function handleFile(file){

      const reader = new FileReader();
      reader.onload = () => setLoadedText(String(reader.result), `"${file.name}"`, file.name);
      reader.onerror = () => { fileInfo.innerHTML = `<div class="ci-note" style="color:var(--hold);">Couldn't read that file &mdash; try again or paste the data instead.</div>`; };
      reader.readAsText(file);
    }

    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    ['dragover','dragenter'].forEach(evt=>{
      dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); });
    });
    ['dragleave','drop'].forEach(evt=>{
      dropzone.addEventListener(evt, (e)=>{ e.preventDefault(); dropzone.classList.remove('drag'); });
    });
    dropzone.addEventListener('drop', (e)=>{
      e.preventDefault();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      handleFile(file);
    });

    document.getElementById('btn-paste-toggle').onclick = () => {
      const showing = pasteArea.style.display !== 'none';
      pasteArea.style.display = showing ? 'none' : 'block';
      if(!showing) storageGet('cache:lastImportText').then(v=>{ if(v && !ta.value) ta.value = v; });

    ta.addEventListener('input', () => setLoadedText(ta.value, null, null));

    document.getElementById('btn-import-back').onclick = () => { state.view='prod-date-picker'; render(); };
    document.getElementById('btn-start').onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Saving…';
      const text = loadedText.trim();
      const {order, tasks} = parseImport(text);
      if(text) await storageSet('cache:lastImportText', text);
      state.rawArtistOrder = order;
      state.rawArtistTasks = tasks;
      await pushRosterToShared(state.activeDate, {fileName: loadedFileName});

      // Verify the save actually persisted rather than trusting it blindly —
      // shared storage only works once this artifact is Published, and writes
      // fail silently otherwise, which is the #1 cause of "no tasks imported" later.
      const verify = await loadRosterFromShared(state.activeDate);
      const verified = !!(verify && verify.order && verify.order.length === order.length);

      state.importResult = {success: verified, count: order.length, date: state.activeDate, errorText: verified ? null : lastStorageError};
      state.view = 'import-result';

  // ---------- SELF ASSIGNMENTS (read-only view of what's assigned) ----------
  function parseLooseDate(str){
    if(!str) return null;
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }
  // Local midnight for "today" — avoids the off-by-one-day bug that comes from
  // parsing a bare "YYYY-MM-DD" string, which JS treats as UTC midnight.
  function todayAsDate(){
    const p = parseYmd(todayKey);
    return new Date(p.y, p.m, p.d);
  }
  // Counts weekdays strictly after fromDate, up through and including toDate.
  function businessDaysBetween(fromDate, toDate){
    let count = 0;
    let d = new Date(fromDate);
    d.setDate(d.getDate()+1);
    while(d <= toDate){
      const dow = d.getDay();
      if(dow !== 0 && dow !== 6) count++;
      d.setDate(d.getDate()+1);
    }
    return count;
  }
  // Auto-computed urgency for a task, based on its start/due dates from Airtable —
  // not something anyone selects manually.
  function computeTaskUrgency(startStr, dueStr){
    const today = todayAsDate();
    const start = parseLooseDate(startStr);
    const due = parseLooseDate(dueStr);

    if(start && start > today){
      const bdays = businessDaysBetween(today, start);
      if(bdays <= 5) return {label:'Upcoming Task', colorVar:'--progress'};
      return null;
    }
    if(!due) return null;
    if(due < today) return {label:'Overdue', colorVar:'--danger'};
    const diffDays = Math.round((due - today) / 86400000);
    if(diffDays <= 2) return {label:'At Risk', colorVar:'--warning'};
    return {label:'On Track', colorVar:'--complete'};
  }

    const blockerCount = countBlockers();
    const showLabel = (state.selectedShow && state.selectedShow !== 'ALL') ? state.selectedShow : 'All Shows';
    const canSwitchShow = getShowSummary().length > 1;

    app.innerHTML = `
      <div class="ci-slate">
        <span>${esc(showLabel)} &mdash; ${esc(labelForDate(state.activeDate))}</span>
        <span class="hi ci-mono">TAKE ${idx+1} / ${total}</span>
      </div>
      <div class="ci-strip">${strip}</div>
      <div class="ci-blocker-bar">
        <div class="ci-blocker-bar-left">
          ${canSwitchShow ? `<button class="ci-toplink" id="btn-switch-show">Switch show</button>` : ''}
          <button class="ci-toplink" id="btn-choose-artist">Choose artist</button>
        </div>
        <button class="ci-toplink" id="btn-view-blockers">View blockers${blockerCount ? ` (${blockerCount})` : ''}</button>
      </div>
      <div class="ci-card">
        <div class="ci-artist-name ci-display">${esc(artist)}</div>
        <div class="ci-sub">${taskOptionsFor(artist).length} task${taskOptionsFor(artist).length===1?'':'s'} assigned in Airtable</div>
        <div id="rows-container">
          ${entries.map((e,i)=>taskRowHTML(artist,e,i,entries.length)).join('')}
        </div>
        <button class="ci-addtask" id="btn-add-row">+ Add another task for ${esc(artist)}</button>
        <div class="ci-navrow">
          <button class="ci-btn" id="btn-prev" ${idx===0?'disabled':''}>&larr; Previous</button>
          <div class="ci-navrow-links">
            <button class="ci-toplink" id="btn-cancel">Save &amp; exit</button>
            <button class="ci-toplink" id="btn-finish">Review &amp; Finish</button>
          </div>
          <button class="ci-btn primary" id="btn-next">${idx===total-1 ? 'Review & Finish' : 'Next \u2192'}</button>
        </div>
      </div>
    `;

    wireRowEvents(artist);

    if(canSwitchShow){
      document.getElementById('btn-switch-show').onclick = async () => {
        saveFormToState(artist);
        await persistCheckin();
        state.view = 'select-show';
        render();
      };
    }
    document.getElementById('btn-choose-artist').onclick = () => {
      saveFormToState(artist);
      state.artistPickerReturn = {index: idx};
      state.view = 'select-artist';
      render();
    };
    document.getElementById('btn-view-blockers').onclick = () => {
      saveFormToState(artist);
      state.blockersReturn = {source:'checkin', index: idx};
      state.view = 'blockers';
      render();
    };
    document.querySelectorAll('[data-jump]').forEach(el=>{
      el.onclick = () => { saveFormToState(artist); state.currentIndex = parseInt(el.dataset.jump,10); render(); };
    });
    document.getElementById('btn-add-row').onclick = () => {
      saveFormToState(artist);
      state.checkin[artist].entries.push(blankEntry());
      render();
    };
    document.getElementById('btn-prev').onclick = () => {
      saveFormToState(artist);
      state.currentIndex = Math.max(0, idx-1);
      render();
    };
    document.getElementById('btn-next').onclick = () => {
      saveFormToState(artist);
      if(idx === total-1){ state.view='summary'; render(); }
      else { state.currentIndex = idx+1; render(); }
    };
    document.getElementById('btn-finish').onclick = () => {
      saveFormToState(artist);
      state.view = 'summary';
      render();
    };
    document.getElementById('btn-cancel').onclick = async () => {
      saveFormToState(artist);
      await persistCheckin();
      await exitToShowPickerOrImport();
    };
  }

  function wireRowEvents(artist){
    document.querySelectorAll('[data-action="remove-row"]').forEach(btn=>{
      btn.onclick = () => {
        saveFormToState(artist);
        const i = parseInt(btn.dataset.idx,10);
        state.checkin[artist].entries.splice(i,1);
        render();
      };
    });
    document.querySelectorAll('#rows-container select[data-role="taskChoice"]').forEach(sel=>{
      sel.addEventListener('change', () => {
        saveFormToState(artist);
        render();
      });
    });
    document.querySelectorAll('#rows-container [data-role="blocker-group"] input[type="radio"]').forEach(input=>{
      input.addEventListener('change', () => {
        saveFormToState(artist);
        render();
      });
    });
  }

  function hasContent(artist){
    const c = state.checkin[artist];
    if(!c) return false;
    return c.entries.some(e => e.taskChoice !== '' || e.notes || e.status || e.hasBlocker || e.blockerText);
  }

  function saveFormToState(artist){
    const rows = document.querySelectorAll('#rows-container .ci-task-row');
    const prevEntries = (state.checkin[artist] && state.checkin[artist].entries) || [];
    const entries = [];
    rows.forEach((row, i)=>{
      const get = (role) => { const el = row.querySelector(`[data-role="${role}"]`); return el ? el.value : ''; };
      const getChecked = (role) => { const el = row.querySelector(`[data-role="${role}"] input:checked`); return el ? el.value : ''; };
      const blockerTextEl = row.querySelector('[data-role="blockerText"]');
      // The blocker description field only renders when "Yes" is selected — preserve
      // whatever was typed even while it's hidden, rather than wiping it on toggle.
      const blockerText = blockerTextEl ? blockerTextEl.value : ((prevEntries[i] && prevEntries[i].blockerText) || '');
      entries.push({
        taskChoice: get('taskChoice'),
        otherText: get('otherText'),
        due: get('due'),
        status: getChecked('status-group'),
        pace: getChecked('pace-group'),
        hasBlocker: getChecked('blocker-group'),
        blockerText,
        notes: get('notes')
      });
    });
    if(entries.length) state.checkin[artist].entries = entries;
  }

  // ---------- SUMMARY VIEW ----------
  function describeEntry(artist, e){
    const opts = taskOptionsFor(artist);
    let taskName = '(no task selected)';
    if(e.taskChoice === 'other') taskName = e.otherText || '(unnamed task)';
    else if(e.taskChoice !== '' && opts[e.taskChoice]) taskName = opts[e.taskChoice].task;
    return taskName;
  }

  function dueForEntry(artist, e){
    if(e.taskChoice !== '' && e.taskChoice !== 'other'){
      const opts = taskOptionsFor(artist);
      const t = opts[e.taskChoice];
      return t ? t.due : '';
    }
    return e.due || '';
  }

  // Builds a fully self-contained payload: resolves task names/due dates now,
  // so saved history and exports never depend on the live Airtable import state.
  function buildPayload(){
    const show = state.selectedShow;
    const dateLabel = labelForDate(state.activeDate);
    const label = (show && show !== 'ALL') ? `${show} Team — ${dateLabel}` : dateLabel;
    return {
      date: state.activeDate,
      show: show,
      label: label,
      artists: state.artistOrder.map(artist=>{
        const entries = (state.checkin[artist] ? state.checkin[artist].entries : []).map(e=>({
          ...e,
          taskName: describeEntry(artist, e),
          dueDisplay: dueForEntry(artist, e)
        }));
        return {artist, entries};
      })
    };
  }

  function taskNameFromStoredEntry(e){
    // backward-compatible: older saved entries may not have taskName resolved yet
    if(e.taskName !== undefined) return e.taskName;
    return e.taskChoice === 'other' ? (e.otherText || '(unnamed task)') : '(task)';
  }

  function isBlocked(e){
    return e.hasBlocker === 'Yes' || e.status === 'On Hold' || e.pace === 'Behind';
  }

  function buildSummaryText(payload){
    const lines = [`Daily Check-in — ${payload.label}`, ''];
    const attention = [];
    payload.artists.forEach(a=>{
      const entries = (a.entries||[]).filter(e => {
        const name = taskNameFromStoredEntry(e);
        return (name && name !== '(no task selected)') || e.notes || e.status || e.blockerText;
      });
      if(!entries.length) return;
      lines.push(`*${a.artist}*`);
      entries.forEach(e=>{
        const name = taskNameFromStoredEntry(e);
        const due = e.dueDisplay ? ` (due ${e.dueDisplay})` : '';
        const status = e.status || 'No status';
        const pace = e.pace ? ` — ${e.pace}` : '';
        lines.push(`• ${name}${due}: ${status}${pace}`);
        if(e.hasBlocker === 'Yes' && e.blockerText) lines.push(`   ⚠ Blocked: ${e.blockerText}`);
        if(e.notes) lines.push(`   Notes: ${e.notes}`);
        if(isBlocked(e)) attention.push(`${a.artist} — ${name}`);
      });
      lines.push('');
    });
    if(attention.length){
      lines.push('*Needs attention:*');
      attention.forEach(t=>lines.push(`• ${t}`));
    }
    return lines.join('\n').trim();
  }

  async function copyTextToClipboard(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch(e){
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(e2){ return false; }
    }
  }

  function downloadTextFile(text, filename){
    const blob = new Blob([text], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function wireExportButtons(payload, dateKeyForFilename){
    const copyBtn = document.getElementById('btn-copy-summary');
    const dlBtn = document.getElementById('btn-download-summary');
    const feedback = document.getElementById('export-feedback');
    if(copyBtn){
      copyBtn.onclick = async () => {
        const ok = await copyTextToClipboard(buildSummaryText(payload));
        feedback.textContent = ok ? 'Copied to clipboard.' : 'Copy failed — try downloading instead.';
        feedback.style.color = ok ? 'var(--accent)' : 'var(--hold)';
        setTimeout(()=>{ if(feedback) feedback.textContent=''; }, 3000);
      };
    }
    if(dlBtn){
      dlBtn.onclick = () => {
        downloadTextFile(buildSummaryText(payload), `checkin_${dateKeyForFilename}.txt`);
      };
    }
  }

  function renderSummary(){
    const payload = buildPayload();
    const rows = payload.artists.map(({artist, entries})=>{
      const taskLines = entries.map(e=>{
        const status = e.status ? `<span class="ci-badge" style="background:${STATUS_COLOR[e.status]}">${esc(e.status)}</span>` : '';
        const pace = e.pace ? `<span class="ci-badge" style="background:${PACE_COLOR[e.pace]}">${esc(e.pace)}</span>` : '';
        return `<div class="ci-sum-task">${esc(e.taskName)} ${status}${pace}${e.hasBlocker==='Yes'&&e.blockerText?`<div style="margin-top:3px;color:var(--hold);">&#9888; ${esc(e.blockerText)}</div>`:''}${e.notes?`<div style="margin-top:3px;color:var(--text-dim)">${esc(e.notes)}</div>`:''}</div>`;
      }).join('');
      return `<div class="ci-sum-artist"><div class="ci-sum-name">${esc(artist)}</div>${taskLines || '<div class="ci-empty">No tasks logged</div>'}</div>`;
    }).join('');

    app.innerHTML = `
      <div class="ci-hero">
        <h1 class="ci-display">Review &amp; Save</h1>
        <p>${esc(payload.label)} &mdash; check everything looks right, then save today's check-in.</p>
      </div>
      <div class="ci-export-row">
        <button class="ci-btn ghost" id="btn-copy-summary">Copy summary</button>
        <button class="ci-btn ghost" id="btn-download-summary">Download .txt</button>
        <button class="ci-btn ghost" id="btn-view-blockers-summary">View blockers</button>
        <span class="ci-export-feedback" id="export-feedback"></span>
      </div>
      <div class="ci-card" style="border-top:1px solid var(--line);border-radius:10px;">
        ${rows}
      </div>
      <div class="ci-navrow">
        <button class="ci-btn" id="btn-back">&larr; Back to edit</button>
        <button class="ci-btn primary" id="btn-save">Save Check-in</button>
      </div>
      <div id="save-error"></div>
    `;
    wireExportButtons(payload, `${state.selectedShow||'all'}_${state.activeDate}`);
    document.getElementById('btn-view-blockers-summary').onclick = () => {
      state.blockersReturn = {source:'summary'};
      state.view = 'blockers';
      render();
    };
    document.getElementById('btn-back').onclick = () => { state.currentIndex = state.artistOrder.length-1; state.view='checkin'; render(); };
    document.getElementById('btn-save').onclick = async () => {
      const saveBtn = document.getElementById('btn-save');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      const ok = await persistCheckin(payload);
      if(!ok){
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Check-in';
        document.getElementById('save-error').innerHTML =
          `<div class="ci-note" style="color:var(--hold);">Save didn't stick — reading it back from storage failed.</div>` +
          (lastStorageError ? `<div class="ci-note ci-mono" style="color:var(--hold);">${esc(lastStorageError)}</div>` : '') +
          `<div class="ci-note">Try clicking Save again — this is often a temporary storage issue. If it keeps happening, make sure this artifact has been Published.</div>`;
        return;
      }
      await exitToShowPickerOrImport();
    };
  }

  async function exitToShowPickerOrImport(){
    const shows = getShowSummary();
    state.view = shows.length > 1 ? 'select-show' : 'prod-home';
    render();
  }

  function hasMeaningfulContent(entries){
    return (entries||[]).some(e => {
      const name = e.taskName;
      const hasTask = name && name !== '(no task selected)';
      return hasTask || e.status || e.pace || e.notes || e.hasBlocker || e.blockerText;
    });
  }

  async function persistCheckin(precomputedPayload){
    const payload = precomputedPayload || buildPayload();
    // Only save artists who actually have something entered in THIS session.
    // Without this, a bulk "Save Check-in" would write a blank placeholder for every
    // artist in the show — including ones the manager skipped past — silently
    // overwriting any real data those artists had already self-submitted earlier.
    const toSave = payload.artists.filter(a => hasMeaningfulContent(a.entries));
    const saved = await Promise.all(toSave.map(a => saveArtistEntry(payload.date, a.artist, a.entries)));
    // Verify every save actually persisted rather than trusting the write blindly
    const checks = await Promise.all(saved.map(s => storageGet(s.key, true)));
    return checks.every(Boolean);
  }

  // ---------- REPORT VIEW ----------
  function groupRecordsByArtist(records){
    const map = {};
    records.forEach(r=>{ (map[r.artist] = map[r.artist]||[]).push(r); });
    Object.values(map).forEach(list=>list.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt)));
    return map;
  }
  function latestPerArtist(records){
    const map = groupRecordsByArtist(records);
    return Object.keys(map).sort().map(artist=>map[artist][0]);
  }

  async function renderReport(){
    // Level 2: a specific date, showing every submission that day, grouped by artist
    if(state.reportDate){
      const records = await listEntriesForDate(state.reportDate);
      const showsPresent = new Set();
      records.forEach(rec => (rec.entries||[]).forEach(e=>{
        const nm = taskNameFromStoredEntry(e);
        if(nm && nm !== '(no task selected)') showsPresent.add(nm.slice(0,3).toUpperCase());
      }));
      const showOptions = ['ALL', ...Array.from(showsPresent).sort()];
      const filter = state.reportShowFilter || 'ALL';

      const grouped = groupRecordsByArtist(records);
      const artistNames = Object.keys(grouped).sort();

      let shownCount = 0;
      const artistSections = artistNames.map(artist=>{
        const filteredRecs = grouped[artist]
          .map(rec=>({...rec, entries: filter==='ALL' ? rec.entries : rec.entries.filter(e=>taskNameFromStoredEntry(e).slice(0,3).toUpperCase()===filter)}))
          .filter(rec => rec.entries && rec.entries.length);
        if(!filteredRecs.length) return '';
        shownCount += filteredRecs.length;
        const subBlocks = filteredRecs.map(rec=>{
          const lines = rec.entries.map(e=>{
            const status = e.status ? `<span class="ci-badge" style="background:${STATUS_COLOR[e.status]}">${esc(e.status)}</span>` : '';
            const pace = e.pace ? `<span class="ci-badge" style="background:${PACE_COLOR[e.pace]}">${esc(e.pace)}</span>` : '';
            const taskName = taskNameFromStoredEntry(e);
            return `<div class="ci-sum-task">${esc(taskName)} ${status}${pace}${e.hasBlocker==='Yes'&&e.blockerText?`<div style="margin-top:3px;color:var(--hold);">&#9888; ${esc(e.blockerText)}</div>`:''}${e.notes?`<div style="margin-top:3px;color:var(--text-dim)">${esc(e.notes)}</div>`:''}</div>`;
          }).join('');
          return `<div class="ci-submission-block"><div class="ci-submission-time">${esc(formatTimeOfDay(rec.submittedAt))}</div>${lines}</div>`;
        }).join('');
        return `<div class="ci-sum-artist"><div class="ci-sum-name">${esc(artist)}</div>${subBlocks}</div>`;
      }).join('');

      const rows = artistSections || '<div class="ci-empty">No submissions match this filter.</div>';

      // Exports use just the latest submission per artist — a clean "current status" snapshot
      const latestRecords = latestPerArtist(records)
        .map(rec=>({...rec, entries: filter==='ALL' ? rec.entries : rec.entries.filter(e=>taskNameFromStoredEntry(e).slice(0,3).toUpperCase()===filter)}))
        .filter(rec => rec.entries && rec.entries.length);
      const reportPayload = {
        label: `Report — ${state.reportDate}`,
        artists: latestRecords.map(rec=>({artist: rec.artist, entries: rec.entries}))
      };

      app.innerHTML = `
        <div class="ci-hero">
          <h1 class="ci-display">${esc(state.reportDate)}</h1>
          <p>${shownCount} of ${records.length} check-in${records.length===1?'':'s'} shown, across ${artistNames.length} artist${artistNames.length===1?'':'s'}.</p>
        </div>
        <div class="ci-export-row">
          ${showOptions.length > 1 ? `<select class="ci-select" id="report-show-filter" style="max-width:150px;width:auto;">${showOptions.map(s=>`<option value="${esc(s)}" ${s===filter?'selected':''}>${s==='ALL'?'All shows':esc(s)}</option>`).join('')}</select>` : ''}
          <button class="ci-btn ghost" id="btn-copy-summary">Copy summary</button>
          <button class="ci-btn ghost" id="btn-download-summary">Download .txt</button>
          <button class="ci-btn ghost" id="btn-view-blockers-report">View blockers</button>
          <span class="ci-export-feedback" id="export-feedback"></span>
        </div>
        <div class="ci-note" style="margin-bottom:10px;">Exports use each artist's most recent check-in only. The list below shows every individual check-in.</div>
        <div class="ci-card" style="border-top:1px solid var(--line);border-radius:10px;">${rows}</div>
        <div class="ci-navrow"><button class="ci-btn" id="btn-back-report-dates">&larr; Back to dates</button><span></span></div>
      `;
      wireExportButtons(reportPayload, `report_${state.reportDate}_${filter}`);
      const filterSel = document.getElementById('report-show-filter');
      if(filterSel) filterSel.onchange = (e) => { state.reportShowFilter = e.target.value; render(); };
      document.getElementById('btn-view-blockers-report').onclick = () => {
        state.blockersReturn = {source:'report', reportDate: state.reportDate, reportShowFilter: filter};
        state.view = 'blockers';
        render();
      };
      document.getElementById('btn-back-report-dates').onclick = () => { state.reportDate = null; render(); };
      return;
    }

    // Level 1: pick a date
    const dates = await listAllEntryDates();
    const items = dates.map(d=>`<li data-date="${esc(d)}"><span>${esc(d)}</span><span class="ci-mono" style="color:var(--text-dim)">view &rarr;</span></li>`).join('');
    app.innerHTML = `
      <div class="ci-hero"><h1 class="ci-display">Report</h1><p>Pick a date to see everything submitted so far, by anyone.</p></div>
      ${dates.length ? `<ul class="ci-histlist">${items}</ul>` : '<div class="ci-empty">No check-ins submitted yet.</div>'}
      <div class="ci-navrow"><button class="ci-btn" id="btn-back-report-home">&larr; Back</button><span></span></div>
    `;
    document.getElementById('btn-back-report-home').onclick = () => { state.view='prod-home'; render(); };
    document.querySelectorAll('#ci-app li[data-date]').forEach(li=>{
      li.onclick = () => { state.reportDate = li.dataset.date; render(); };
    });
  }

  // ---------- BLOCKERS VIEW ----------
  async function renderBlockers(){
    const src = state.blockersReturn || {source:'checkin', index:0};
    let payload;
    if(src.source === 'report'){
      const records = await listEntriesForDate(src.reportDate);
      const filter = src.reportShowFilter || 'ALL';
      // Use only each artist's most recent check-in — an old resolved blocker from
      // earlier in the day shouldn't still show as a current blocker.
      const latest = latestPerArtist(records);
      const filtered = latest
        .map(rec=>({...rec, entries: filter==='ALL' ? rec.entries : rec.entries.filter(e=>taskNameFromStoredEntry(e).slice(0,3).toUpperCase()===filter)}))
        .filter(rec => rec.entries && rec.entries.length);
      payload = {
        label: `Report — ${src.reportDate}`,
        artists: filtered.map(rec=>({artist: rec.artist, entries: rec.entries}))
      };
    } else {
      payload = buildPayload();
    }

    const blocked = [];
    (payload.artists||[]).forEach(({artist, entries})=>{
      (entries||[]).forEach(e=>{
        if(isBlocked(e)){
          blocked.push({
            artist,
            name: taskNameFromStoredEntry(e),
            due: e.dueDisplay || e.due || '',
            status: e.status,
            pace: e.pace,
            blockerText: e.hasBlocker === 'Yes' ? e.blockerText : '',
            notes: e.notes
          });
        }
      });
    });

    const rows = blocked.length ? blocked.map(b => `
      <div class="ci-sum-artist">
        <div class="ci-sum-name">${esc(b.artist)}</div>
        <div class="ci-sum-task">
          ${esc(b.name)}${b.due ? ` <span class="ci-mono" style="color:var(--text-dim)">(due ${esc(b.due)})</span>` : ''}
          ${b.status ? `<span class="ci-badge" style="background:${STATUS_COLOR[b.status]}">${esc(b.status)}</span>` : ''}
          ${b.pace ? `<span class="ci-badge" style="background:${PACE_COLOR[b.pace]}">${esc(b.pace)}</span>` : ''}
          ${b.blockerText ? `<div style="margin-top:3px;color:var(--hold);">&#9888; ${esc(b.blockerText)}</div>` : ''}
          ${b.notes ? `<div style="margin-top:3px;color:var(--text-dim)">${esc(b.notes)}</div>` : ''}
        </div>
      </div>
    `).join('') : '<div class="ci-empty">No one has flagged a blocker or is On Hold / Behind right now.</div>';

    app.innerHTML = `
      <div class="ci-hero">
        <h1 class="ci-display">Blockers</h1>
        <p>${esc(payload.label || '')} &mdash; everyone currently On Hold or Behind pace, at a glance.</p>
      </div>
      <div class="ci-card" style="border-top:1px solid var(--line);border-radius:10px;">
        ${rows}
      </div>
      <div class="ci-navrow">
        <button class="ci-btn" id="btn-blockers-back">&larr; Back</button>
        <span></span>
      </div>
    `;

    document.getElementById('btn-blockers-back').onclick = () => {
      if(src.source === 'report'){ state.view = 'report'; state.reportDate = src.reportDate; state.reportShowFilter = src.reportShowFilter; }
      else if(src.source === 'summary'){ state.view = 'summary'; }
      else { state.view = 'checkin'; state.currentIndex = src.index; }
      render();
    };
  }

  // init
  document.getElementById('ci-home-btn').onclick = () => {
    state.role = null;
    state.view = 'landing';
    render();
  };
  render();
})();
</script>
